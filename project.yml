name: macanikal
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
targets:
  macanikal:
    type: application
    platform: macOS
    sources:
      - path: macanikal
        excludes:
          - "Resources/Audio/**"
      - path: macanikal/Resources/Audio
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Macanikal
        PRODUCT_BUNDLE_IDENTIFIER: com.macanikal.app
        DEVELOPMENT_TEAM: S9B6RY8H74
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: macanikal/Info.plist
      properties:
        LSUIElement: true
        CFBundleIconFile: AppIcon
        CFBundleDisplayName: Macanikal
        NSHumanReadableCopyright: ""
  macanikalTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: macanikalTests
    dependencies:
      - target: macanikal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macanikal.app.tests
        DEVELOPMENT_TEAM: S9B6RY8H74
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Macanikal.app/Contents/MacOS/Macanikal
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  macanikal:
    build:
      targets:
        macanikal: all
        macanikalTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - macanikalTests
